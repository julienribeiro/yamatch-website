<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#D7FF00">
    <meta name="description" content="Invitation à rejoindre un tournoi sur Yamatch.">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">

    <meta property="og:title" content="Yamatch | Invitation tournoi">
    <meta property="og:site_name" content="Yamatch">
    <meta property="og:description" content="Tu es invité à rejoindre un tournoi. Ouvre Yamatch sur ton iPhone ou Android.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:url" content="https://appyamatch.fr/tournament-invite/">
    <meta property="og:image" content="https://appyamatch.fr/assets/social_preview.jpg">

    <title>Yamatch — Invitation tournoi</title>

    <link rel="icon" type="image/x-icon" sizes="48x48" href="../favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="../site.webmanifest">
    <link rel="preload" as="font" type="font/woff2" href="../fonts/Inter-Variable.woff2" crossorigin>
    <link rel="stylesheet" href="../styles.min.css">
</head>
<body>

<main class="download-page">
    <section class="download-hero" aria-labelledby="inviteTitle">
        <p class="download-eyebrow">Invitation tournoi</p>
        <h1 id="inviteTitle" class="download-title">Rejoins ce tournoi sur Yamatch</h1>
        <p id="inviteBody" class="download-body">Ouvre l'app pour consulter l'invitation et rejoindre le tournoi.</p>
        <a id="openInApp" class="download-back" aria-disabled="true">Ouvrir dans Yamatch</a>
        <a class="download-back" href="../download/">Télécharger Yamatch</a>
    </section>
</main>

<script>
    (function () {
        function readToken() {
            var fromQuery = new URLSearchParams(window.location.search).get('token');
            if (fromQuery && fromQuery.trim()) return fromQuery.trim();
            var match = window.location.pathname.replace(/\/+$/, '').match(/\/tournament-invite\/(.+)$/);
            return match && match[1] ? decodeURIComponent(match[1]) : null;
        }

        function isValidToken(value) {
            return Boolean(value && value.length <= 128 && /^[A-Za-z0-9_-]+$/.test(value));
        }

        function fallbackUrl() {
            var ua = navigator.userAgent || '';
            if (/iPhone|iPad|iPod/i.test(ua) && !window.MSStream) {
                return 'https://apps.apple.com/fr/app/yamatch/id6773454974';
            }
            if (/Android/i.test(ua)) {
                return 'https://play.google.com/store/apps/details?id=com.appyamatch.yamatch';
            }
            return '/download/';
        }

        function openApp(token) {
            var didLeavePage = false;
            function markPageLeft() {
                didLeavePage = true;
            }
            function handleVisibilityChange() {
                if (document.visibilityState === 'hidden') markPageLeft();
            }

            document.addEventListener('visibilitychange', handleVisibilityChange);
            window.addEventListener('pagehide', markPageLeft);
            window.location.href = 'com.appyamatch.yamatch://tournament-invite/' + encodeURIComponent(token);

            window.setTimeout(function () {
                document.removeEventListener('visibilitychange', handleVisibilityChange);
                window.removeEventListener('pagehide', markPageLeft);
                if (!didLeavePage && document.visibilityState === 'visible') {
                    window.location.href = fallbackUrl();
                }
            }, 1500);
        }

        var token = readToken();
        var link = document.getElementById('openInApp');
        if (!isValidToken(token)) {
            document.getElementById('inviteTitle').textContent = 'Invitation invalide';
            document.getElementById('inviteBody').textContent = "Ce lien d'invitation est invalide ou incomplet.";
            return;
        }

        link.setAttribute('href', 'com.appyamatch.yamatch://tournament-invite/' + encodeURIComponent(token));
        link.setAttribute('aria-disabled', 'false');
        link.addEventListener('click', function (event) {
            event.preventDefault();
            openApp(token);
        });
    })();
</script>

</body>
</html>
